<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=20260813" />

    <!-- これがあると Android が「アプリをインストール」を出す。
         無いとホーム画面に置いてもただのブックマークになる（2026-08-10 に追加） -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- スマホ向けの下ごしらえ。
         maximum-scale と user-scalable=no は入れない（勝手に拡大を禁じると
         見えにくい人が困る）。viewport-fit=cover は iPhone のノッチの外まで
         背景を伸ばすため。safe-area の余白は CSS 側で取る -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff00aa" />

    <!-- ホーム画面に置いたときに、ブラウザの枠なしで開く（iPhone / Android 共通） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tinyCUBE" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=20260813" />

    <meta name="description" content="撮ってある動画に、声とエフェクトを一発撮りで乗せる。編集画面はありません。" />

    <!-- 写真に乗せる文字の手描きフォント。ゴシックだと当時のプリクラに見えない
         （2026-08-14、伊波さん「手描きフォントにするほうが当時のプリクラ
         再現率上がる」）。写真の編集でしか使わないので display=swap で待たせない。
         ここは Web アプリなので外から読んでよい（CMCUBE 本体とは事情が違う） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Mochiy+Pop+One&display=swap"
      rel="stylesheet"
    />

    <title>tinyCUBE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

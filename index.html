<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- スマホ向けの下ごしらえ。
         maximum-scale と user-scalable=no は入れない（勝手に拡大を禁じると
         見えにくい人が困る）。viewport-fit=cover は iPhone のノッチの外まで
         背景を伸ばすため。safe-area の余白は CSS 側で取る -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <!-- ホーム画面に置いたときに、ブラウザの枠なしで開く（iPhone / Android 共通） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tinyCUBE" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta name="description" content="撮ってある動画に、声とエフェクトを一発撮りで乗せる。編集画面はありません。" />

    <title>tinyCUBE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

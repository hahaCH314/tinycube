<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00aa" />
      <stop offset="40%" stop-color="#cc00ff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff99cc" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3399" />
      <stop offset="100%" stop-color="#cc0066" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9900ff" />
      <stop offset="100%" stop-color="#6600cc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />

  <!-- Y2K plastic glossy overlay -->
  <path d="M 0 120 Q 0 0 120 0 L 392 0 Q 512 0 512 120 L 512 200 Q 256 350 0 200 Z" fill="rgba(255,255,255,0.25)" />

  <!-- Sparkles -->
  <path d="M 80 120 Q 110 120 110 90 Q 110 120 140 120 Q 110 120 110 150 Q 110 120 80 120 Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 380 90 Q 400 90 400 70 Q 400 90 420 90 Q 400 90 400 110 Q 400 90 380 90 Z" fill="#ffff00" filter="url(#glow)"/>
  <path d="M 410 380 Q 430 380 430 360 Q 430 380 450 380 Q 430 380 430 400 Q 430 380 410 380 Z" fill="#00ffff" filter="url(#glow)"/>
  <path d="M 120 400 Q 135 400 135 385 Q 135 400 150 400 Q 135 400 135 415 Q 135 400 120 400 Z" fill="#ff00ff" filter="url(#glow)"/>

  <!-- Hearts -->
  <path d="M 360 280 A 25 25 0 0 1 410 280 A 25 25 0 0 1 460 280 Q 460 330 410 370 Q 360 330 360 280 Z" fill="#ff66b2" stroke="#ffffff" stroke-width="4" transform="rotate(-15 410 325)"/>
  <path d="M 60 250 A 20 20 0 0 1 100 250 A 20 20 0 0 1 140 250 Q 140 290 100 320 Q 60 290 60 250 Z" fill="#ff33cc" stroke="#ffffff" stroke-width="3" transform="rotate(20 100 285)"/>

  <!-- 3D Cube (Center) -->
  <g transform="translate(256, 250) scale(1.1)">
    <!-- Back drop shadow for cube -->
    <path d="M 0 30 L 90 -22 L 0 -74 L -90 -22 Z" fill="rgba(0,0,0,0.3)" filter="url(#glow)" transform="translate(0, 80)"/>
    
    <!-- Top Face -->
    <path d="M 0 -80 L 100 -25 L 0 30 L -100 -25 Z" fill="url(#cube-top)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <path d="M -100 -25 L 0 30 L 0 130 L -100 75 Z" fill="url(#cube-left)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <path d="M 0 30 L 100 -25 L 100 75 L 0 130 Z" fill="url(#cube-right)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner Highlights -->
    <path d="M -90 -20 L -10 24 L -10 115" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 90 -20 L 10 24 L 10 115" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round"/>
    <path d="M -85 -30 L 0 -70 L 85 -30" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Text "tinyCUBE" -->
  <text x="256" y="470" font-family="sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glow)">tinyCUBE</text>
  <text x="256" y="470" font-family="sans-serif" font-weight="900" font-size="52" fill="#ff00aa" text-anchor="middle" letter-spacing="2">tinyCUBE</text>

</svg>

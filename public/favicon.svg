<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- CMCUBE と同じ立方体。同じ会社のものだと一目で分かるように形は揃え、
       色だけシティポップ（水色が主役）にして見分ける
       （2026-08-11、伊波さんの指示）。赤い点は両方から外した -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f3d"/>
      <stop offset="1" stop-color="#0a0520"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.5" stop-color="#66e7ff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9566ff"/>
      <stop offset="1" stop-color="#4a1f9e"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66e7ff"/>
      <stop offset="1" stop-color="#1176b8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="196" fill="url(#plate)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="188" fill="none" stroke="#66e7ff" stroke-opacity="0.3" stroke-width="10"/>

  <g filter="url(#glow)">
    <!-- 立方体。上面が明るく、左が紫、右が水色。16px でも三面が分かれて見える -->
    <path d="M512 212 L772 362 L512 512 L252 362 Z" fill="url(#top)"/>
    <path d="M252 362 L512 512 L512 812 L252 662 Z" fill="url(#left)"/>
    <path d="M772 362 L772 662 L512 812 L512 512 Z" fill="url(#right)"/>
  </g>

  <!-- 稜線。小さくしたときに面の境目が潰れないように入れる -->
  <g fill="none" stroke="#e8fbff" stroke-opacity="0.55" stroke-width="9" stroke-linejoin="round">
    <path d="M512 212 L772 362 L512 512 L252 362 Z"/>
    <path d="M252 362 L252 662 L512 812 L772 662 L772 362"/>
    <path d="M512 512 L512 812"/>
  </g>
</svg>
